const q=document.getElementById('q'),grid=document.getElementById('grid'),stats=document.getElementById('stats');
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const s=norm(q.value.trim());const rows=data.filter(x=>!s||norm(x.name+' '+x.ing+' '+x.id).includes(s));stats.textContent=`Hiển thị ${rows.length} / ${data.length} công thức trong ảnh (mục #1 không có trong ảnh).`;if(!rows.length){grid.innerHTML='<div class="empty">Không tìm thấy công thức phù hợp.</div>';return}grid.innerHTML=rows.map(x=>`<article class="card"><div class="row"><div class="id">#${x.id}</div><div class="name">${esc(x.name)}</div></div><p class="ing">${x.ing.split('+').map(v=>`<span class="chip">${esc(v.trim())}</span>`).join('')}</p></article>`).join('')}
q.addEventListener('input',render);document.getElementById('clear').onclick=()=>{q.value='';q.focus();render()};render();
</script></body></html>
